# =============================================
# WorkInX - Spring Boot Configuration
# =============================================

server.port=3000

# ---- Base de Datos MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/workinx?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ---- Configuración Spring Data JPA (RETO 1, 4, 5) ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Base de Datos NoSQL MongoDB (PLUS RETO) ----
spring.data.mongodb.uri=mongodb://localhost:27017/workinx_audit
spring.data.mongodb.auto-index-creation=true

# ---- Milla Extra: Rate Limiting ----
app.rate-limit.max-requests-per-minute=60

# ---- JWT ----
jwt.secret=tu_secreto_super_seguro
jwt.expiration=7200000

# ---- URL de la App ----
app.url=http://localhost:3000
app.uploads.dir=uploads

# ---- Multipart ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging (RETO 3: INFO, WARN, ERROR) ----
logging.level.root=INFO
logging.level.com.workinx=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
